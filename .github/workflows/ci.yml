name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  landing:
    name: Landing (HTMLHint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npx -y htmlhint@1 "*.html"

  api:
    name: API (lint, tipos, pruebas unitarias y e2e)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/api }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gopark
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gopark
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run test:e2e
      - run: npm run build

  web:
    name: Web (lint, tipos y build)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/web }
    env:
      JWT_SECRET: ci-secret
      API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
